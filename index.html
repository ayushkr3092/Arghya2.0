<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arghya 2.0 | Quick Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Modern Animated Background matching Arghya Poster vibe */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #41236d, #822111, #a46a21, #41236d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Container */
        .glass-container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        /* Logo Styling */
        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fad165; /* Gold accent */
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(250, 209, 101, 0.5); /* Neon glow */
        }

        /* Typography */
        .title {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: -webkit-linear-gradient(#fad165, #ffad47);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            margin: 5px 0 30px 0;
            font-size: 14px;
            font-weight: 400;
            opacity: 0.85;
            letter-spacing: 1px;
        }

        /* Quick Links Buttons */
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background: rgba(250, 209, 101, 0.2);
            border-color: #fad165;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(250, 209, 101, 0.3);
        }

        /* Special highlight for Membership pass */
        .btn.special {
            background: rgba(250, 209, 101, 0.15);
            border: 1px solid #fad165;
            color: #fad165;
        }

        /* Footer */
        .footer {
            margin-top: 35px;
            font-size: 12px;
            opacity: 0.7;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <!-- Bada sa logo idhar aayega -->
        <img src="WhatsApp Image 2026-10-26 at 23.21.44.jpeg" alt="Arghya 2.0 Logo" class="logo">
        
        <h1 class="title">ARGHYA 2.0</h1>
        <p class="subtitle">Triveni - The Purvanchal Society</p>

        <!-- Forms ke Quick Links -->
        <div class="links">
            <a href="https://forms.gle/3yqfRVd6G4x2Jw9J8" class="btn" target="_blank">
                🎤 Participant Registration
            </a>
            
            <a href="https://forms.gle/PYG8g5JjK5kKbaqZ6" class="btn" target="_blank">
                🎟️ Free Audience Pass
            </a>
            
            <a href="https://forms.gle/j9VMqqi8WBuLGNfDA" class="btn special" target="_blank">
                👑 Special Members Pass (₹151)
            </a>
        </div>

        <div class="footer">
            <p>Management: Ayush (+91 88822 98137)</p>
            <p>IG: @_purvanchal_du_ | @triveni_venky_</p>
        </div>
    </div>

</body>
</html>
